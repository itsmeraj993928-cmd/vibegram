name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor CLI & Android
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Ensure Dist Directory
        run: mkdir -p dist && touch dist/index.html

      - name: Re-create Android Folder
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test -Dorg.gradle.java.home=$JAVA_HOME
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibegram-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
